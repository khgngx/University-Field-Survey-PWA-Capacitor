<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f1" />
    <title>VKU Field Survey</title>
    <script>
      // Applies the saved theme before first paint so a dark-theme user never sees a light flash.
      // Same storage key and rule as src/preferences/store.js; documentSync.js takes over on load.
      try {
        var theme = (JSON.parse(localStorage.getItem('vku-survey:preferences')) || {}).theme
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      } catch (err) {
        // Storage is blocked or corrupt: the light palette shows until the app loads.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
